[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uscis-autofill"
version = "0.0.1"
description = "Passport-first checks and edition-safe filling of USCIS forms, for law firms."
requires-python = ">=3.11"
# Everything here is permissively licensed. PyMuPDF (AGPL) is deliberately NOT a dependency.
dependencies = [
    "pypdf>=5",
    "cryptography",       # USCIS blanks are encrypted (empty user password)
    "pillow",
    "pypdfium2",          # renders scanned PDFs for OCR and the verification renders
    "pywebview>=5",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",   # Apple on-device OCR, the first reader on a Mac       # native desktop window; the UI talks to Python in-process, no server
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uscis-autofill = "uscis_autofill.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uscis_autofill = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
